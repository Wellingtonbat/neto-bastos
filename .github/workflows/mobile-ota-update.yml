name: Publish mobile OTA update

# Publica uma atualizacao OTA (Expo/EAS Update) no branch "preview" sempre
# que um push na main mexer em codigo JS/TS do app mobile ou do pacote
# compartilhado @neto-bastos/core (que o mobile consome via dist/).
#
# Isso so cobre mudancas JS-only. Mudancas em configuracao nativa (chaves
# android/ios do apps/mobile/app.json, novos modulos nativos) precisam de
# um build nativo completo via `eas build`, que continua manual (ver
# CLAUDE.md) — este workflow nao substitui isso.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - ".github/workflows/mobile-ota-update.yml"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build @neto-bastos/core
        run: yarn workspace @neto-bastos/core build

      - name: Publish EAS Update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Mesmos valores do profile "preview" em apps/mobile/eas.json — nao
          # sao segredos (prefixo EXPO_PUBLIC_ e sempre embutido no bundle do
          # cliente), mas precisam estar presentes aqui porque `eas update`
          # nao le o bloco `env` do eas.json (isso so vale para `eas build`).
          # Sem eles o bundle publicado cai no fallback localhost e quebra o
          # app assim que a atualizacao OTA e aplicada.
          EXPO_PUBLIC_API_BASE_URL: https://neto-bastos.onrender.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 420633978191-ammiui5ge00kvd30tb0un06u8s0jsc0o.apps.googleusercontent.com
        run: npx eas-cli update --branch preview --message "${{ github.event.head_commit.message || github.sha }}" --non-interactive
