name: Keep Render services awake

# Faz "ping" no backend e no frontend do Render a cada 10 minutos para
# evitar o spin-down por inatividade do plano free (que ocorre apos ~15
# minutos sem trafego). O ping no backend bate num endpoint publico que
# consulta o banco (Neon), ajudando a manter o banco acordado tambem.
#
# So roda das 6h as 23h59 no horario de Brasilia (madrugada fica de fora
# de proposito: sem cliente agendando corte de cabelo as 3h da manha, nao
# vale a pena manter as instancias acordadas o tempo todo). O cron do
# GitHub Actions roda em UTC (Brasilia = UTC-3), entao o campo de hora
# "9-23,0-2" corresponde a 6h-23h59 no horario de Brasilia.
on:
  schedule:
    - cron: "*/10 9-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (Render + Neon)
        continue-on-error: true
        run: |
          curl -sS --max-time 90 -o /dev/null -w "backend: %{http_code}\n" \
            https://neto-bastos.onrender.com/profissional

      - name: Ping frontend (Render)
        continue-on-error: true
        run: |
          curl -sS --max-time 90 -o /dev/null -w "frontend: %{http_code}\n" \
            https://netobastos.onrender.com/
